<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book list</title>
</head>
<body>

<h1>All books</h1>

<ul>
    <li th:each="book : ${books}">
        <span th:text="${book.title}"></span>,
        Author: <span th:text="${book.author}"></span>,
        Genre: <span th:text="${book.genre}"></span>
    </li>
</ul>

</body>
</html>
